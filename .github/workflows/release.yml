name: Publish release assets

on:
  push:
    tags: ['*.*.*', 'v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn validate
      - run: yarn build
        env:
          CI: 'true'
      - name: Package generated assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          asset_id=$(node -p "require('./config/product.json').id")
          archive="${asset_id}-assets-${RELEASE_TAG}.tar.gz"
          tar -czf "$archive" -C dist .
          sha256sum "$archive" > "$archive.sha256"
      - name: Create GitHub release with generated assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          asset_id=$(node -p "require('./config/product.json').id")
          archive="${asset_id}-assets-${RELEASE_TAG}.tar.gz"
          gh release create "$RELEASE_TAG" \
            "$archive" "$archive.sha256" dist/manifest.json \
            --verify-tag --generate-notes --title "$RELEASE_TAG"
