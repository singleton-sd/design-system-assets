name: Publish versioned Pages

on:
  push:
    branches: [main]
    tags: ['*.*.*', 'v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn validate
      - run: yarn build
        env:
          CI: 'true'
      - name: Publish current catalog
        if: startsWith(github.ref, 'refs/heads/')
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: |
            releases
            CNAME
      - name: Publish immutable version directory
        if: startsWith(github.ref, 'refs/tags/')
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: dist
          target-folder: releases/${{ github.ref_name }}
          clean: false
