name: Publish versioned Pages

on:
  push:
    branches: [main]
    tags: ['*.*.*', 'v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn validate
      - run: yarn test
      - run: yarn build
        env:
          CI: 'true'
      - name: Validate semantic version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Reject an existing version snapshot
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/releases/${RELEASE_TAG}?ref=gh-pages")
          if [ "$status" = 200 ]; then
            echo "Version snapshot already exists: releases/$RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$status" != 404 ]; then
            echo "Unable to verify version snapshot (HTTP $status)." >&2
            exit 1
          fi
      - name: Publish current catalog
        if: startsWith(github.ref, 'refs/heads/')
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: |
            releases
            CNAME
      - name: Publish immutable version directory
        if: startsWith(github.ref, 'refs/tags/')
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: dist
          target-folder: releases/${{ github.ref_name }}
          clean: false
