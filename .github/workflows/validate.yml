name: Validate assets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn validate
      - run: yarn build
        env:
          CI: 'true'
      - name: Ensure build did not modify sources
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: asset-catalog-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
